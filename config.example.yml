# 复制为 config.local.yml 后填写（config.local.yml 已在 .gitignore 中，不会被提交）
# 也可以直接用环境变量，见 README「配置」一节。

database:
  # MIMIC-IV 所在的 PostgreSQL。密码**只**通过环境变量 PGPASSWORD 传入，禁止写入本文件。
  host: localhost
  port: 2023
  user: postgres
  dbname: postgres
  # password: 不要填 —— 使用: export PGPASSWORD=xxxx

paths:
  # 队列 xlsx（每患者一行，含 outcome）。不随仓库分发。
  cohort_xlsx: ./cohort/alf_icu_final_first_stay.xlsx
  # 所有中间产物与结果的输出目录
  data_dir: ./data

analysis:
  landmark_day: 2        # 主分析 landmark L（天，自 ICU 入科起算）
  horizons: [7, 14]      # 预测视界 h：预测 Day L 之后 h 天内的死亡
  markers: [Bilirubin, INR, Creatinine]   # 进入联合模型的纵向标志物
  n_clusters: 3          # 轨迹表型数（由肘部法则确定）

jm:
  n_chains: 3
  n_iter: 3000
  n_burnin: 1500
  n_thin: 2
  seed: 2024
