# Copy to config.local.yml and fill in (config.local.yml is git-ignored and never committed).
# You can also use environment variables; see the "Configuration" section of README.md.

database:
  # PostgreSQL instance hosting MIMIC-IV. The password is passed **only** via the PGPASSWORD
  # environment variable; never write it into this file.
  host: localhost
  port: 2023
  user: postgres
  dbname: postgres
  # password: leave unset -- use: export PGPASSWORD=xxxx

paths:
  # Cohort xlsx (one row per patient, includes outcome). Not distributed with the repository.
  cohort_xlsx: ./cohort/alf_icu_final_first_stay.xlsx
  # Output directory for all intermediate and final results
  data_dir: ./data

analysis:
  landmark_day: 2        # primary landmark L (days since ICU admission)
  horizons: [7, 14]      # prediction horizons h: death within h days after day L
  markers: [Bilirubin, INR, Creatinine]   # longitudinal markers entering the joint model
  n_clusters: 3          # number of trajectory phenotypes (chosen by the elbow method)

jm:
  n_chains: 3
  n_iter: 3000
  n_burnin: 1500
  n_thin: 2
  seed: 2024
